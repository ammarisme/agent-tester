# Tooling config for the controller API. Runtime deps live in requirements.txt.
[project]
name = "agent-tester-controller"
version = "0.2.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# B008: FastAPI's Depends()/File() defaults are idiomatic.
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "agent_tester"]
