[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-tester"
dynamic = ["version"]
description = "Statistical evaluation runner for HTTP agents: datasets in, distributions out."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Agent Tester contributors" }]
keywords = ["agents", "llm", "evaluation", "testing", "http"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "jsonpath-ng>=1.7.0",
  "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
agent-tester = "agent_tester.cli:main"

[tool.hatch.version]
path = "agent_tester/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["agent_tester"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003: ×, –, · and ✓ are deliberate in user-facing output.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
